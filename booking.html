<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodday Booking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #F3F4F6; }
        .theme-pink { background-color: #d81b60; }
        .theme-text { color: #d81b60; }
        .theme-border { border-color: #d81b60; }
        .page-section { display: none; animation: fadeIn 0.3s ease; }
        .page-section.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        
        .cal-day { aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 50%; font-size: 14px; cursor: pointer; transition: 0.2s; position: relative; }
        .cal-active { background-color: #d81b60 !important; color: white !important; font-weight: bold; box-shadow: 0 4px 10px rgba(216,27,96,0.3); }
        
        #liff-loading { position:fixed; inset:0; background:#fff; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }
        
        /* สไตล์ปุ่มรอบเวลาแบบกล่องยาว */
        .slot-box {
            display: flex; justify-content: space-between; align-items: center;
            width: 100%; padding: 1rem; border-radius: 0.75rem; border: 1px solid #E5E7EB;
            margin-bottom: 0.5rem; transition: all 0.2s; background-color: white;
        }
        .slot-box.active { border-color: #d81b60; background-color: #fdf2f8; box-shadow: 0 2px 4px rgba(216,27,96,0.1); }
        .slot-box.disabled { background-color: #F3F4F6; color: #9CA3AF; cursor: not-allowed; border-color: #E5E7EB; }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div id="liff-loading">
        <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center mb-2">
            <i class="fa-solid fa-calendar-check text-3xl text-pink-500"></i>
        </div>
        <p class="text-gray-500 font-medium">กำลังโหลดกิจกรรม...</p>
    </div>

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">

        <div class="theme-pink text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide"><i class="fa-solid fa-calendar-check mr-2"></i>Goodday</h1>
            <div id="user-greeting" class="text-sm font-medium bg-white bg-opacity-20 px-3 py-1 rounded-full">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
        </div>

        <div id="page-book" class="page-section active">
            <div class="flex overflow-x-auto px-4 py-3 gap-2 border-b bg-white sticky top-[60px] z-40 no-scrollbar">
                <button onclick="setFilter('ทั้งหมด', this)" class="cat-btn theme-pink text-white px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap shadow-sm">ทั้งหมด</button>
                <button onclick="setFilter('สุขภาพ', this)" class="cat-btn bg-gray-50 text-gray-600 border px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">👨‍⚕️ สุขภาพ</button>
                <button onclick="setFilter('เวิร์คช็อป', this)" class="cat-btn bg-gray-50 text-gray-600 border px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">🌱 เวิร์คช็อป</button>
                <button onclick="setFilter('พื้นที่พัก', this)" class="cat-btn bg-gray-50 text-gray-600 border px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap">❤️ พื้นที่พักผ่อน</button>
            </div>
            <div id="activity-list" class="p-4 space-y-4"></div>
        </div>

        <div id="page-calendar" class="page-section p-4">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">ปฏิทินกิจกรรม</h2>
            <div class="bg-white border rounded-2xl shadow-sm p-4 mb-6">
                <div class="flex justify-between items-center mb-4">
                    <button onclick="changeMonth(-1)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-chevron-left"></i></button>
                    <h3 id="cal-month-year" class="font-bold text-lg text-gray-800">เดือน</h3>
                    <button onclick="changeMonth(1)" class="w-8 h-8 rounded-full bg-gray-100 flex items-center justify-center"><i class="fa-solid fa-chevron-right"></i></button>
                </div>
                <div class="grid grid-cols-7 text-center text-xs font-bold text-gray-400 mb-2">
                    <div>อา</div><div>จ</div><div>อ</div><div>พ</div><div>พฤ</div><div>ศ</div><div>ส</div>
                </div>
                <div id="calendar-grid" class="grid grid-cols-7 gap-1"></div>
            </div>
            <div>
                <h3 class="font-bold text-gray-700 mb-3 border-l-4 theme-border pl-2" id="selected-date-text">กิจกรรมวันที่เลือก</h3>
                <div id="selected-date-activities" class="space-y-3"></div>
            </div>
        </div>

        <div id="page-history" class="page-section p-4 pt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4 text-center">ประวัติการจอง</h2>
            <div id="history-list" class="space-y-4"></div>
        </div>

        <div id="page-confirm" class="page-section p-4 pt-6">
            <div class="flex items-center mb-6">
                <button onclick="showPage('book')" class="w-10 h-10 bg-gray-100 rounded-full text-gray-600 mr-3"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="text-xl font-bold text-gray-800">เลือกรอบเวลา</h2>
            </div>

            <div class="bg-white border rounded-xl p-4 mb-6 shadow-sm">
                <p class="text-sm text-pink-500 font-bold mb-1">กิจกรรม</p>
                <h3 id="confirm-act-name" class="text-gray-800 font-bold text-lg leading-snug mb-2">-</h3>
                <p class="text-xs text-gray-500"><i class="fa-solid fa-location-dot mr-1"></i> <span id="confirm-act-prov">-</span></p>
            </div>
            
            <p class="font-bold text-gray-800 mb-3"><i class="fa-regular fa-clock theme-text mr-2"></i>เลือกรอบเวลาที่ต้องการ</p>
            
            <div id="time-slot-container" class="mb-6"></div>

            <button onclick="submitBooking(this)" id="btn-submit-booking" disabled class="w-full bg-gray-300 text-white py-3.5 rounded-xl font-bold text-lg shadow-md transition">ยืนยันการจอง</button>
        </div>

        <div id="page-success" class="page-section p-6 pt-12 text-center">
            <div class="text-6xl mb-4 text-green-500"><i class="fa-solid fa-circle-check"></i></div>
            <h2 class="text-2xl font-bold text-gray-800 mb-2">จองสำเร็จ!</h2>
            <p class="text-gray-500 text-sm mb-6">รหัสการจองของคุณคือ</p>
            <div id="show-booking-id" class="inline-block bg-green-50 text-green-600 text-3xl font-bold px-6 py-3 rounded-xl border border-green-200 mb-6 shadow-sm">BK-000000</div>
            <p class="text-sm text-gray-500 mb-6">ระบบได้ส่งข้อความยืนยันไปที่ LINE ของท่านแล้ว</p>
            <button onclick="showPage('book')" class="w-full bg-gray-100 text-gray-700 py-3.5 rounded-xl font-bold text-lg hover:bg-gray-200">กลับสู่หน้าหลัก</button>
        </div>

        <div class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around py-2 text-xs font-bold text-gray-400 z-50 shadow-[0_-4px_15px_rgba(0,0,0,0.03)]">
            <button onclick="showPage('book')" id="nav-book" class="nav-btn flex flex-col items-center theme-text w-1/3 py-1">
                <i class="fa-solid fa-calendar-check text-xl mb-1"></i> กิจกรรม
            </button>
            <button onclick="showPage('calendar')" id="nav-calendar" class="nav-btn flex flex-col items-center w-1/3 py-1">
                <i class="fa-regular fa-calendar-days text-xl mb-1"></i> ปฏิทิน
            </button>
            <button onclick="showPage('history')" id="nav-history" class="nav-btn flex flex-col items-center w-1/3 py-1">
                <i class="fa-solid fa-clock-rotate-left text-xl mb-1"></i> ประวัติ
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwN8QmRIb5gVByL6nrZ_H_kYWiYwULaSQOBT5ahS0XBISwTONw80GZgiTRssPcUmIWQ/exec"; 
        const LIFF_ID_BOOKING = "2009970638-NL6GN7HE";
        
        let currentUser = null;
        let allActivities = [];
        let myBookedActivities = [];
        let currentCatFilter = 'ทั้งหมด';
        let pendingActivity = null;
        let currentDate = new Date();
        const monthNames = ["มกราคม", "กุมภาพันธ์", "มีนาคม", "เมษายน", "พฤษภาคม", "มิถุนายน", "กรกฎาคม", "สิงหาคม", "กันยายน", "ตุลาคม", "พฤศจิกายน", "ธันวาคม"];
        let selectedTimeSlot = null;

        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: action, data: data }), redirect: "follow" 
                });
                return await response.json();
            } catch (error) { return { success: false, message: "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้" }; }
        }

        document.addEventListener("DOMContentLoaded", function() {
            const saved = localStorage.getItem('gooddaySession');
            if(saved) currentUser = JSON.parse(saved);

            liff.init({ liffId: LIFF_ID_BOOKING }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(async profile => {
                        // ดึงข้อมูลสมาชิกล่าสุดจาก UID ทุกครั้งที่เปิดเว็บ
                        const res = await callAPI("autoLoginByUid", { uid: profile.userId });
                        if(res && res.memberId) {
                            currentUser = res;
                            localStorage.setItem('gooddaySession', JSON.stringify(currentUser));
                            updateHeaderUser();
                        } else {
                            // ถ้าไม่เป็นสมาชิก ให้แจ้งเตือนแล้วเด้งไปหน้าโปรไฟล์ (หรือปิด LIFF)
                            document.getElementById('liff-loading').style.display = 'none';
                            alert("กรุณาสมัครสมาชิกที่ระบบโปรไฟล์ก่อนทำการจองกิจกรรมครับ");
                            // liff.closeWindow(); 
                        }
                    });
                } else { liff.login(); }
            });

            updateHeaderUser();
            fetchActivities();
        });

        function updateHeaderUser() {
            const header = document.getElementById('user-greeting');
            if(currentUser) {
                header.innerHTML = `<i class="fa-solid fa-user-check mr-1"></i> ${currentUser.name}`;
                header.className = "text-sm font-bold bg-white bg-opacity-20 px-3 py-1 rounded-full text-white";
            } else {
                header.innerHTML = `ผู้เยี่ยมชม`;
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            window.scrollTo(0, 0);

            document.querySelectorAll('.nav-btn').forEach(el => { el.classList.remove('theme-text'); el.classList.add('text-gray-400'); });
            const activeNav = document.getElementById('nav-' + pageId);
            if(activeNav) { activeNav.classList.remove('text-gray-400'); activeNav.classList.add('theme-text'); }

            if(pageId === 'calendar') renderCalendar();
            if(pageId === 'history') fetchHistory();
        }

        async function fetchActivities() {
            let res = await callAPI("getActivities");
            allActivities = Array.isArray(res) ? res : [];
            
            if(currentUser) {
                const history = await callAPI("getUserBookings", { phone: currentUser.phone });
                myBookedActivities = Array.isArray(history) ? history.filter(h => h.status === 'ยืนยันการจอง').map(h => h.activity) : [];
            }
            
            renderActivityList();
            renderCalendar();
            document.getElementById('liff-loading').style.display = 'none';
        }

        function renderActivityList() {
            let list = allActivities;
            if (currentUser && currentUser.province) {
                list = list.filter(a => a.province === currentUser.province || a.province === "" || a.province === "ทั้งหมด");
            }
            if (currentCatFilter !== 'ทั้งหมด') list = list.filter(a => a.category === currentCatFilter);

            let html = list.map(a => {
                let isBooked = myBookedActivities.includes(a.name);
                let badgeHtml = a.totalRemaining > 0 
                    ? `<span class="bg-pink-100 text-pink-600 text-[11px] px-2.5 py-1 rounded-md font-bold">ว่าง ${a.totalRemaining} ที่</span>` 
                    : `<span class="bg-gray-100 text-gray-500 text-[11px] px-2.5 py-1 rounded-md font-bold">เต็มแล้ว</span>`;
                
                let btnHtml = '';
                if(isBooked) {
                    btnHtml = `<button disabled class="w-full bg-green-50 text-green-600 py-2.5 rounded-xl font-bold border border-green-200 cursor-not-allowed">✅ จองเรียบร้อย</button>`;
                } else if (a.totalRemaining > 0) {
                    btnHtml = `<button onclick="handleBookClick('${a.name}')" class="w-full theme-pink text-white py-2.5 rounded-xl font-bold shadow-sm hover:bg-pink-700 transition">จองทันที</button>`;
                } else {
                    btnHtml = `<button disabled class="w-full bg-gray-100 text-gray-400 py-2.5 rounded-xl font-bold cursor-not-allowed">เต็มแล้ว</button>`;
                }

                let detailsHtml = a.details ? `<div class="bg-gray-50 p-3 rounded-lg text-xs text-gray-600 leading-relaxed"><i class="fa-solid fa-circle-info theme-text mr-1"></i> ${a.details}</div>` : '';

                return `
                <div class="bg-white rounded-2xl border border-gray-100 shadow-sm overflow-hidden">
                    <img src="${a.image || 'https://via.placeholder.com/400'}" class="w-full h-40 object-cover">
                    <div class="p-4">
                        <div class="flex justify-between items-start mb-2">
                            <h2 class="text-base font-bold text-gray-800 leading-snug w-3/4">${a.name}</h2>
                            ${badgeHtml}
                        </div>
                        <div class="text-sm text-gray-500 space-y-2 mb-4 font-medium">
                            <p><i class="fa-regular fa-clock w-5 text-center"></i> ${a.datetime}</p>
                            <p><i class="fa-solid fa-location-dot w-5 text-center"></i> ${a.province || 'ทุกพื้นที่'}</p>
                            ${detailsHtml}
                        </div>
                        ${btnHtml}
                    </div>
                </div>`;
            }).join('');
            document.getElementById('activity-list').innerHTML = html || '<div class="text-center py-10 text-gray-400 font-medium">ไม่พบกิจกรรมในพื้นที่ของคุณ</div>';
        }

        function setFilter(name, btn) {
            currentCatFilter = name;
            document.querySelectorAll('.cat-btn').forEach(b => { b.className = "cat-btn bg-gray-50 text-gray-600 border px-4 py-1.5 rounded-full text-sm font-medium whitespace-nowrap"; });
            btn.className = "cat-btn theme-pink text-white px-4 py-1.5 rounded-full text-sm font-bold whitespace-nowrap shadow-sm";
            renderActivityList();
        }

        function renderCalendar() {
            const m = currentDate.getMonth(); const y = currentDate.getFullYear();
            document.getElementById('cal-month-year').innerText = `${monthNames[m]} ${y}`;
            const first = new Date(y, m, 1).getDay(); const days = new Date(y, m + 1, 0).getDate();
            let grid = ''; for(let i=0; i<first; i++) grid += '<div></div>';
            
            const today = new Date();
            for(let day=1; day<=days; day++){
                const dStr = `${y}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
                let acts = allActivities.filter(a => a.calDate === dStr);
                if (currentUser && currentUser.province) acts = acts.filter(a => a.province === currentUser.province || a.province === "" || a.province === "ทั้งหมด");
                
                let dot = '';
                if(acts.length > 0){
                    const isMine = acts.some(a => myBookedActivities.includes(a.name));
                    dot = `<div class="w-1.5 h-1.5 ${isMine ? 'bg-green-500' : 'bg-pink-500'} rounded-full absolute bottom-1"></div>`;
                }
                const isToday = (day === today.getDate() && m === today.getMonth() && y === today.getFullYear());
                grid += `<div onclick="selectDate('${dStr}',${day},${m})" class="cal-day ${isToday ? 'cal-active' : 'text-gray-700 font-medium'}">${day}${dot}</div>`;
            }
            document.getElementById('calendar-grid').innerHTML = grid;
        }

        function changeMonth(step) { currentDate.setMonth(currentDate.getMonth()+step); renderCalendar(); }
        
        function selectDate(dStr, d, m) {
            document.getElementById('selected-date-text').innerText = `วันที่ ${d} ${monthNames[m]}`;
            let acts = allActivities.filter(a => a.calDate === dStr);
            if (currentUser && currentUser.province) acts = acts.filter(a => a.province === currentUser.province || a.province === "" || a.province === "ทั้งหมด");
            
            let html = acts.length === 0 ? '<p class="text-xs text-gray-400 py-4 text-center w-full font-medium">ไม่มีกิจกรรมในวันนี้</p>' : acts.map(a => {
                let isBooked = myBookedActivities.includes(a.name);
                let btn = isBooked ? `<button disabled class="bg-green-50 text-green-600 px-3 py-1.5 rounded-lg text-xs font-bold border border-green-200">✅ จองแล้ว</button>` :
                          a.totalRemaining > 0 ? `<button onclick="handleBookClick('${a.name}')" class="theme-pink text-white px-4 py-1.5 rounded-lg text-xs font-bold shadow-sm">จอง</button>` :
                          `<button disabled class="bg-gray-100 text-gray-400 px-3 py-1.5 rounded-lg text-xs font-bold">เต็ม</button>`;
                return `
                <div class="bg-white p-3 rounded-xl flex justify-between items-center text-sm mb-3 border border-gray-100 shadow-sm">
                    <div class="flex flex-col pr-2">
                        <span class="font-bold text-gray-800 leading-snug">${a.name}</span>
                        <span class="text-[11px] text-gray-500 mt-1 font-medium"><i class="fa-regular fa-clock"></i> ${a.datetime}</span>
                    </div>
                    <div>${btn}</div>
                </div>`;
            }).join('');
            document.getElementById('selected-date-activities').innerHTML = html;
        }

        function handleBookClick(name) {
            if(!currentUser) { alert("กรุณาสมัครสมาชิกก่อนครับ"); return; }
            const act = allActivities.find(a => a.name === name);
            if(!act) return;
            
            pendingActivity = act; selectedTimeSlot = null;
            document.getElementById('btn-submit-booking').disabled = true;
            document.getElementById('btn-submit-booking').className = "w-full bg-gray-300 text-white py-3.5 rounded-xl font-bold text-lg shadow-md transition";
            
            document.getElementById('confirm-act-name').innerText = act.name;
            document.getElementById('confirm-act-prov').innerText = act.province || "ทุกพื้นที่";
            
            // สร้างกล่องเลือกรอบเวลาแบบยาว
            let slotsHtml = act.slots.map(slot => {
                if (slot.remaining > 0) {
                    return `
                    <button onclick="selectSlot(this, '${slot.time}')" class="slot-box">
                        <div class="flex items-center">
                            <div class="w-5 h-5 rounded-full border-2 border-gray-300 mr-3 flex items-center justify-center check-circle"></div>
                            <span class="font-bold text-base text-gray-800">${slot.time}</span>
                        </div>
                        <span class="bg-pink-50 text-pink-600 text-[11px] px-3 py-1 rounded-full font-bold">ว่าง ${slot.remaining}</span>
                    </button>`;
                } else {
                    return `
                    <button disabled class="slot-box disabled">
                        <div class="flex items-center">
                            <div class="w-5 h-5 rounded-full border-2 border-gray-300 mr-3"></div>
                            <span class="font-bold text-base line-through">${slot.time}</span>
                        </div>
                        <span class="text-[11px] font-bold">เต็ม</span>
                    </button>`;
                }
            }).join('');
            
            document.getElementById('time-slot-container').innerHTML = slotsHtml;
            showPage('confirm');
        }

        function selectSlot(btn, time) {
            // รีเซ็ตทุกกล่อง
            document.querySelectorAll('.slot-box').forEach(b => {
                if(!b.classList.contains('disabled')) {
                    b.classList.remove('active');
                    b.querySelector('.check-circle').innerHTML = '';
                    b.querySelector('.check-circle').classList.replace('border-pink-500', 'border-gray-300');
                }
            });
            // ไฮไลต์กล่องที่เลือก
            btn.classList.add('active');
            btn.querySelector('.check-circle').classList.replace('border-gray-300', 'border-pink-500');
            btn.querySelector('.check-circle').innerHTML = '<div class="w-2.5 h-2.5 bg-pink-500 rounded-full"></div>';
            
            selectedTimeSlot = time;
            const submitBtn = document.getElementById('btn-submit-booking');
            submitBtn.disabled = false;
            submitBtn.className = "w-full theme-pink text-white py-3.5 rounded-xl font-bold text-lg shadow-md hover:bg-pink-700 transition";
        }
        
        async function submitBooking(btn) {
            if (!selectedTimeSlot) return;
            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังจอง...';
            
            const res = await callAPI("saveBooking", { 
                user: currentUser, activityName: pendingActivity.name, timeSlot: selectedTimeSlot
            });
            
            btn.disabled = false; btn.innerText = "ยืนยันการจอง";
            if(res.success) {
                document.getElementById('show-booking-id').innerText = res.bookingId;
                fetchActivities(); showPage('success');
            } else { alert(res.message); }
        }

        async function fetchHistory() {
            if(!currentUser) return;
            document.getElementById('history-list').innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin text-2xl theme-text"></i></div>';
            const data = await callAPI("getUserBookings", { phone: currentUser.phone });
            
            let html = (!data || data.length === 0) ? '<p class="text-center py-10 text-gray-400 font-medium">ไม่พบประวัติการจอง</p>' : data.map(b => {
                const ok = (b.status === "ยืนยันการจอง");
                return `
                <div class="bg-white border border-gray-100 rounded-2xl p-4 shadow-sm mb-4">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-sm text-gray-800 w-3/4">${b.activity}</h3>
                        <span class="text-[10px] px-2 py-1 rounded-md font-bold ${ok?'text-green-600 bg-green-50':'text-red-500 bg-red-50'}">${b.status}</span>
                    </div>
                    <p class="text-[11px] text-gray-500 font-medium mb-1"><i class="fa-solid fa-hashtag mr-1"></i> ${b.id}</p>
                    <p class="text-[11px] text-gray-500 font-medium"><i class="fa-regular fa-calendar mr-1"></i> ${b.date}</p>
                    ${ok ? `<div class="flex justify-center my-4"><img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=${b.id}" class="border rounded-xl shadow-sm"></div>` : ''}
                    ${ok ? `<button onclick="cancelIt('${b.id}')" class="w-full text-red-500 text-xs font-bold border border-red-100 py-2 rounded-xl hover:bg-red-50 transition mt-2">ยกเลิกการจอง</button>` : ''}
                </div>`;
            }).join('');
            document.getElementById('history-list').innerHTML = html;
        }

        async function cancelIt(id) {
            if(!confirm("ยืนยันยกเลิกรายการนี้?")) return;
            const res = await callAPI("cancelBooking", { id: id, phone: currentUser.phone });
            if(res.success) { fetchActivities(); fetchHistory(); }
            else alert(res.message);
        }
    </script>
</body>
</html>
