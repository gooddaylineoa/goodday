<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodday Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Sarabun', sans-serif; background-color: #F3F4F6; }
        .theme-pink { background-color: #d81b60; }
        .theme-text { color: #d81b60; }
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .form-input {
            width: 100%; border: 1px solid #D1D5DB; border-radius: 0.5rem; padding: 0.5rem;
            font-family: 'Sarabun', sans-serif; font-size: 0.875rem; background-color: white;
        }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">

        <div class="theme-pink text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
            <h1 class="text-lg font-bold tracking-wide"><i class="fa-solid fa-store mr-2"></i>Goodday Shop</h1>
            <div id="login-status" class="text-sm font-medium bg-white bg-opacity-20 px-3 py-1 rounded-full">
                <i class="fa-solid fa-spinner fa-spin"></i>
            </div>
        </div>

        <div id="page-shop" class="page-section active p-4">
            <div id="banner-waste" class="bg-gradient-to-r from-green-500 to-green-600 rounded-xl p-4 text-white shadow-md mb-4 hidden">
                <div class="flex items-center">
                    <div class="text-3xl mr-3"><i class="fa-solid fa-recycle"></i></div>
                    <div>
                        <h3 class="font-bold text-lg leading-tight">สิทธิพิเศษ Waste Money</h3>
                        <p class="text-xs text-green-100 mt-1">รับส่วนลด 25% เมื่อสั่งซื้อสินค้าทุกรายการ</p>
                    </div>
                </div>
            </div>

            <div id="product-list" class="grid grid-cols-2 gap-3">
                <div class="text-center py-10 col-span-2 font-medium text-gray-500">กำลังโหลดสินค้า...</div>
            </div>
        </div>

        <div id="page-cart" class="page-section p-4 pt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fa-solid fa-cart-shopping theme-text mr-2"></i>ตะกร้าของคุณ</h2>
            <div id="cart-list" class="space-y-3"></div>
            <div class="mt-6 bg-white p-4 rounded-xl shadow-sm border border-pink-100 hidden" id="cart-summary-box">
                <div class="flex justify-between font-bold text-lg mb-4 text-gray-800">
                    <span>ยอดรวมสินค้า:</span>
                    <span id="cart-total-price" class="theme-text">฿0</span>
                </div>
                <button onclick="prepareCheckout()" class="w-full theme-pink text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-pink-700 transition">ดำเนินการชำระเงิน</button>
            </div>
        </div>

        <div id="page-checkout" class="page-section p-4 pt-6 pb-24">
            <div class="flex items-center mb-6">
                <button onclick="showPage('cart')" class="w-10 h-10 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 mr-3"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="text-xl font-bold text-gray-800">สรุปคำสั่งซื้อ</h2>
            </div>
            
            <div class="bg-white border rounded-xl p-4 shadow-sm mb-4">
                <h3 class="font-bold text-sm text-gray-800 mb-2 border-b pb-2">รายการสินค้า</h3>
                <div id="co-items-container" class="space-y-2 mt-2"></div>
            </div>

            <div class="bg-white border rounded-xl p-4 shadow-sm mb-4">
                <p class="font-bold text-gray-800 mb-3"><i class="fa-solid fa-truck-fast theme-text mr-2"></i>รูปแบบการจัดส่ง</p>
                <select id="co-delivery" onchange="updateTotal()" class="w-full border rounded-lg p-3 bg-gray-50 text-sm focus:outline-none focus:border-pink-500 font-bold">
                    <option value="รับหน้างาน">รับหน้างาน (ฟรีค่าส่ง)</option>
                    <option value="รับที่บ้าน">รับที่บ้าน (+50 บาท)</option>
                </select>
                
                <div id="co-address-box" class="mt-4 hidden">
                    <div class="flex gap-4 mb-3 text-sm font-medium">
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="addrType" value="profile" checked onchange="toggleAddressMode()" class="accent-pink-500 w-4 h-4"> ที่อยู่เดิม
                        </label>
                        <label class="flex items-center gap-2 cursor-pointer">
                            <input type="radio" name="addrType" value="new" onchange="toggleAddressMode()" class="accent-pink-500 w-4 h-4"> ที่อยู่ใหม่
                        </label>
                    </div>

                    <div id="box-addr-profile" class="p-3 bg-pink-50 border border-pink-100 rounded-lg">
                        <p class="text-xs font-bold text-pink-600 mb-1"><i class="fa-solid fa-location-dot mr-1"></i> จัดส่งไปที่:</p>
                        <p id="co-address-text" class="text-xs text-gray-700 leading-relaxed font-medium">-</p>
                    </div>

                    <div id="box-addr-new" class="hidden space-y-2 mt-2 bg-gray-50 p-3 rounded-lg border border-gray-200">
                        <p class="text-xs font-bold text-gray-600 mb-2">กรอกข้อมูลที่อยู่จัดส่งใหม่</p>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="new-house" placeholder="บ้านเลขที่ *" class="form-input">
                            <input type="text" id="new-moo" placeholder="หมู่" class="form-input">
                        </div>
                        <input type="text" id="new-road" placeholder="ซอย / ถนน" class="form-input">
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="new-subdist" placeholder="ตำบล *" class="form-input">
                            <input type="text" id="new-dist" placeholder="อำเภอ *" class="form-input">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <input type="text" id="new-prov" placeholder="จังหวัด *" class="form-input">
                            <input type="text" id="new-zip" placeholder="รหัสไปรษณีย์ *" class="form-input">
                        </div>
                    </div>
                </div>
            </div>

            <div class="bg-white border rounded-xl p-4 shadow-sm mb-6 space-y-2 text-sm font-medium">
                <div class="flex justify-between text-gray-500"><span>ค่าสินค้า</span><span id="co-subtotal"></span></div>
                
                <div id="co-discount-row" class="flex justify-between text-green-500 hidden">
                    <span><i class="fa-solid fa-tag mr-1"></i> ส่วนลด Waste Money (25%)</span>
                    <span id="co-discount" class="font-bold"></span>
                </div>
                
                <div class="flex justify-between text-gray-500"><span>ค่าจัดส่ง</span><span id="co-shipping-fee"></span></div>
                <hr class="border-dashed my-2">
                <div class="flex justify-between font-bold text-lg"><span class="text-gray-800">ยอดชำระสุทธิ</span><span id="co-total-price" class="theme-text"></span></div>
            </div>
            <button onclick="submitOrder(this)" class="w-full theme-pink text-white py-3.5 rounded-xl font-bold text-lg shadow-md hover:bg-pink-700 transition">ยืนยันคำสั่งซื้อ</button>
        </div>

        <div id="page-orders" class="page-section bg-gray-50 pb-20">
            <div class="flex overflow-x-auto bg-white border-b sticky top-[60px] z-40 no-scrollbar text-sm font-bold text-gray-500">
                <button onclick="filterOrder('ที่ต้องชำระ', this)" class="order-tab active border-b-2 border-pink-600 theme-text px-4 py-3 whitespace-nowrap">ที่ต้องชำระ</button>
                <button onclick="filterOrder('เตรียมจัดส่ง', this)" class="order-tab px-4 py-3 whitespace-nowrap">เตรียมจัดส่ง</button>
                <button onclick="filterOrder('จัดส่งแล้ว', this)" class="order-tab px-4 py-3 whitespace-nowrap">จัดส่งแล้ว</button>
                <button onclick="filterOrder('จัดส่งเสร็จสิ้น', this)" class="order-tab px-4 py-3 whitespace-nowrap">สำเร็จ</button>
            </div>
            <div id="order-list" class="p-4 space-y-4"></div>
        </div>

        <div class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around py-2 text-xs font-bold text-gray-400 z-50 shadow-[0_-4px_15px_rgba(0,0,0,0.03)]">
            <button onclick="showPage('shop')" id="nav-shop" class="nav-btn flex flex-col items-center theme-text w-1/3 py-1">
                <i class="fa-solid fa-store text-xl mb-1"></i> ร้านค้า
            </button>
            <button onclick="showPage('cart')" id="nav-cart" class="nav-btn flex flex-col items-center w-1/3 py-1 relative">
                <i class="fa-solid fa-cart-shopping text-xl mb-1"></i> ตะกร้า
                <span id="cart-badge" class="absolute top-1 right-7 bg-red-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
            </button>
            <button onclick="showPage('orders')" id="nav-orders" class="nav-btn flex flex-col items-center w-1/3 py-1">
                <i class="fa-solid fa-clipboard-list text-xl mb-1"></i> คำสั่งซื้อ
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwN8QmRIb5gVByL6nrZ_H_kYWiYwULaSQOBT5ahS0XBISwTONw80GZgiTRssPcUmIWQ/exec";
        const LIFF_ID_SHOP = "ใส่_LIFF_ID_ของระบบร้านค้าตรงนี้";

        let currentUser = null;
        let allProducts = [];
        let myOrders = [];
        let shopCart = [];
        let cartSubtotal = 0;
        let currentTab = 'ที่ต้องชำระ';
        let isCheckingLogin = true;

        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: action, data: data }), redirect: "follow"
                });
                return await response.json();
            } catch (error) { return { success: false, message: "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้" }; }
        }

        document.addEventListener("DOMContentLoaded", function() {
            fetchProducts();
            const saved = localStorage.getItem('gooddaySession');
            if (saved) {
                currentUser = JSON.parse(saved);
                isCheckingLogin = false;
                updateHeader();
                fetchOrders();
            }

            liff.init({ liffId: LIFF_ID_SHOP }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(async profile => {
                        const res = await callAPI("autoLoginByUid", { uid: profile.userId });
                        isCheckingLogin = false;
                        if (res && res.memberId) {
                            currentUser = res;
                            localStorage.setItem('gooddaySession', JSON.stringify(currentUser));
                            updateHeader();
                            fetchOrders();
                        } else if (!currentUser) {
                            document.getElementById('login-status').innerHTML = `ผู้เยี่ยมชม`;
                        }
                    });
                } else { liff.login(); }
            }).catch(err => { isCheckingLogin = false; });
        });

        function updateHeader() {
            if(currentUser) {
                document.getElementById('login-status').innerHTML = `<i class="fa-solid fa-user-check mr-1"></i> ${currentUser.name}`;
                if(currentUser.wasteMoney === "ใช่") {
                    document.getElementById('banner-waste').classList.remove('hidden');
                }
            }
        }

        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            window.scrollTo(0, 0);

            document.querySelectorAll('.nav-btn').forEach(el => { el.classList.remove('theme-text'); el.classList.add('text-gray-400'); });
            if (document.getElementById('nav-' + pageId)) {
                document.getElementById('nav-' + pageId).classList.remove('text-gray-400');
                document.getElementById('nav-' + pageId).classList.add('theme-text');
            }
            if (pageId === 'orders') fetchOrders();
            if (pageId === 'cart') renderCart();
        }

        async function fetchProducts() {
            const res = await callAPI("getProducts");
            if (Array.isArray(res)) {
                allProducts = res;
                let html = res.map(p => `
                <div class="bg-white border rounded-2xl shadow-sm overflow-hidden flex flex-col justify-between border-gray-100">
                    <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-32 object-cover">
                    <div class="p-3">
                        <h3 class="text-sm font-bold text-gray-800 leading-snug mb-1 line-clamp-2">${p.name}</h3>
                        <p class="text-sm font-bold theme-text mb-3">฿${p.price}</p>
                        <button onclick="addToCart('${p.id}')" class="w-full border border-pink-500 text-pink-600 bg-pink-50 py-1.5 rounded-xl text-xs font-bold hover:bg-pink-500 hover:text-white transition"><i class="fa-solid fa-cart-plus mr-1"></i> หยิบใส่ตะกร้า</button>
                    </div>
                </div>`).join('');
                document.getElementById('product-list').innerHTML = html || '<div class="text-center col-span-2 py-10 text-gray-400 font-medium">ยังไม่มีสินค้า</div>';
            }
        }

        // --- ระบบตะกร้า ---
        function addToCart(id) {
            if (isCheckingLogin) { alert("รอสักครู่ ระบบกำลังโหลดข้อมูล..."); return; }
            if (!currentUser) { alert("กรุณาสมัครสมาชิกที่ระบบสมาชิก"); return; }
            const product = allProducts.find(p => p.id === id);
            if (!product) return;
            const existing = shopCart.find(item => item.id === id);
            if (existing) existing.qty += 1;
            else shopCart.push({ ...product, qty: 1 });
            
            updateCartBadge();
            let toast = document.createElement("div");
            toast.className = "fixed top-20 left-1/2 transform -translate-x-1/2 bg-gray-800 text-white px-4 py-2 rounded-full text-xs z-50 font-medium";
            toast.innerText = `เพิ่มลงตะกร้าแล้ว`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 1500);
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalQty = shopCart.reduce((sum, item) => sum + item.qty, 0);
            if (totalQty > 0) { badge.innerText = totalQty; badge.classList.remove('hidden'); } 
            else { badge.classList.add('hidden'); }
            if (document.getElementById('page-cart').classList.contains('active')) renderCart();
        }

        function updateQty(id, delta) {
            const item = shopCart.find(i => i.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) shopCart = shopCart.filter(i => i.id !== id);
                updateCartBadge();
            }
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const summaryBox = document.getElementById('cart-summary-box');
            if (shopCart.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-16 flex flex-col items-center">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-300 text-3xl mb-3"><i class="fa-solid fa-basket-shopping"></i></div>
                        <p class="text-gray-400 font-medium mb-4">ตะกร้าของคุณว่างเปล่า</p>
                        <button onclick="showPage('shop')" class="bg-pink-50 text-pink-600 px-6 py-2 rounded-full text-sm font-bold border border-pink-100">ไปเลือกซื้อสินค้า</button>
                    </div>`;
                summaryBox.classList.add('hidden');
                return;
            }
            summaryBox.classList.remove('hidden');
            let total = 0;
            list.innerHTML = shopCart.map(item => {
                total += item.price * item.qty;
                return `
                <div class="bg-white border border-gray-100 rounded-xl p-3 shadow-sm flex gap-3 items-center">
                    <img src="${item.image || 'https://via.placeholder.com/150'}" class="w-16 h-16 object-cover rounded-lg border border-gray-100">
                    <div class="flex-1">
                        <h3 class="text-sm font-bold text-gray-800 line-clamp-1">${item.name}</h3>
                        <p class="text-xs theme-text font-bold mt-1">฿${item.price}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500">-</button>
                        <span class="text-sm font-bold w-3 text-center">${item.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500">+</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-total-price').innerText = '฿' + total;
            cartSubtotal = total;
        }

        // --- ระบบ Checkout ---
        function prepareCheckout() {
            if(shopCart.length === 0) return;
            document.getElementById('co-items-container').innerHTML = shopCart.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg text-sm border border-gray-100">
                    <span class="truncate pr-2 font-medium text-gray-700">${item.name} <span class="text-gray-400 ml-1 font-normal">x${item.qty}</span></span>
                    <span class="font-bold text-gray-800">฿${item.price * item.qty}</span>
                </div>
            `).join('');

            document.getElementById('co-subtotal').innerText = '฿' + cartSubtotal;
            document.getElementById('co-delivery').value = 'รับหน้างาน';
            
            // เซ็ตที่อยู่โปรไฟล์เริ่มต้น
            const a = currentUser.address || {};
            const fullAdr = `${a.house||''} ม.${a.moo||''} ถ.${a.road||''} ต.${a.subdist||''} อ.${a.dist||''} จ.${a.prov||''} ${a.zip||''}`;
            document.getElementById('co-address-text').innerText = (a.house && a.prov) ? fullAdr : "⚠️ ข้อมูลที่อยู่ไม่ครบถ้วน กรุณาอัปเดต";

            updateTotal();
            showPage('checkout');
        }

        function toggleAddressMode() {
            const mode = document.querySelector('input[name="addrType"]:checked').value;
            if(mode === 'profile') {
                document.getElementById('box-addr-profile').classList.remove('hidden');
                document.getElementById('box-addr-new').classList.add('hidden');
            } else {
                document.getElementById('box-addr-profile').classList.add('hidden');
                document.getElementById('box-addr-new').classList.remove('hidden');
            }
        }

        function updateTotal() {
            const delType = document.getElementById('co-delivery').value;
            let discount = 0;
            
            // คำนวณส่วนลด 25% ถ้าเป็นสมาชิก Waste Money
            if(currentUser && currentUser.wasteMoney === "ใช่") {
                discount = Math.floor(cartSubtotal * 0.25);
                document.getElementById('co-discount-row').classList.remove('hidden');
                document.getElementById('co-discount').innerText = '-฿' + discount;
            } else {
                document.getElementById('co-discount-row').classList.add('hidden');
            }

            let total = cartSubtotal - discount;
            let shippingFee = 0;

            if (delType === 'รับที่บ้าน') {
                shippingFee = 50;
                total += shippingFee;
                document.getElementById('co-address-box').classList.remove('hidden');
            } else {
                document.getElementById('co-address-box').classList.add('hidden');
            }

            document.getElementById('co-shipping-fee').innerText = '฿' + shippingFee;
            document.getElementById('co-total-price').innerText = '฿' + total;
        }

        async function submitOrder(btn) {
            const delType = document.getElementById('co-delivery').value;
            const addrMode = document.querySelector('input[name="addrType"]:checked').value;
            let finalAddress = {};

            if (delType === 'รับที่บ้าน') {
                if (addrMode === 'profile') {
                    if (!currentUser.address || !currentUser.address.house || !currentUser.address.prov) {
                        alert("ข้อมูลที่อยู่โปรไฟล์ไม่สมบูรณ์ กรุณาเลือก 'ที่อยู่ใหม่' หรือไปแก้ไขที่โปรไฟล์"); return;
                    }
                    finalAddress = currentUser.address;
                } else {
                    finalAddress = {
                        house: document.getElementById('new-house').value, moo: document.getElementById('new-moo').value,
                        road: document.getElementById('new-road').value, subdist: document.getElementById('new-subdist').value,
                        dist: document.getElementById('new-dist').value, prov: document.getElementById('new-prov').value, zip: document.getElementById('new-zip').value
                    };
                    if (!finalAddress.house || !finalAddress.subdist || !finalAddress.dist || !finalAddress.prov || !finalAddress.zip) {
                        alert("กรุณากรอกข้อมูลที่อยู่ใหม่ให้ครบถ้วน"); return;
                    }
                }
            }

            btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังสั่งซื้อ...';

            let discount = (currentUser.wasteMoney === "ใช่") ? Math.floor(cartSubtotal * 0.25) : 0;
            let finalPrice = cartSubtotal - discount + (delType === 'รับที่บ้าน' ? 50 : 0);

            const orderData = {
                phone: currentUser.phone,
                lineUid: currentUser.lineUid || "",
                cartItems: shopCart.map(i => ({ name: i.name, qty: i.qty })),
                totalPrice: finalPrice,
                deliveryType: delType,
                address: finalAddress
            };

            const res = await callAPI("placeOrder", orderData);
            btn.disabled = false; btn.innerText = 'ยืนยันคำสั่งซื้อ';
            
            if (res.success) {
                alert("สั่งซื้อสำเร็จ! โปรดแนบสลิปโอนเงินเพื่อยืนยัน");
                shopCart = []; updateCartBadge(); fetchOrders(); showPage('orders');
            } else { alert("ข้อผิดพลาดระบบ: " + res.message); }
        }

        // --- ระบบประวัติคำสั่งซื้อ ---
        async function fetchOrders() {
            if (!currentUser) return;
            document.getElementById('order-list').innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin theme-text text-2xl"></i></div>';
            const res = await callAPI("getMyOrders", { phone: currentUser.phone });
            if (Array.isArray(res)) { myOrders = res; renderOrders(); }
        }

        function filterOrder(status, btnElement) {
            currentTab = status;
            document.querySelectorAll('.order-tab').forEach(b => b.classList.remove('border-b-2', 'border-pink-600', 'theme-text'));
            btnElement.classList.add('border-b-2', 'border-pink-600', 'theme-text');
            renderOrders();
        }

        function renderOrders() {
            let filtered = myOrders.filter(o => o.status === currentTab || (currentTab === 'ที่ต้องชำระ' && o.status === 'รอตรวจสอบสลิป'));
            let html = filtered.map(o => {
                let actionBtn = '';
                if (o.status === 'ที่ต้องชำระ') {
                    // ทำกล่องบัญชีโอนเงินให้ใหญ่และเด่นชัดขึ้น
                    actionBtn = `
                    <div class="mt-4 bg-pink-50 p-4 rounded-xl border-2 border-pink-200 text-center shadow-inner">
                        <p class="text-xs text-gray-500 mb-1 font-bold">โอนเงินเข้าบัญชี</p>
                        <div class="text-2xl font-bold theme-text mb-1 tracking-wider">012-3-45678-9</div>
                        <p class="text-sm font-bold text-gray-700 mb-4">ธนาคารกสิกรไทย (โครงการ Goodday)</p>
                        
                        <input type="file" id="slip-${o.id}" accept="image/*" class="w-full mb-3 text-sm file:mr-3 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-bold file:bg-white file:text-pink-600 file:shadow-sm">
                        <button onclick="submitSlip('${o.id}')" class="w-full theme-pink text-white py-3 rounded-xl text-base font-bold shadow-md hover:bg-pink-700">ส่งหลักฐานการโอนเงิน</button>
                    </div>`;
                } else if (o.status === 'รอตรวจสอบสลิป') {
                    actionBtn = `<div class="mt-4 text-center text-sm text-orange-500 bg-orange-50 py-3 rounded-xl font-bold border border-orange-100"><i class="fa-solid fa-hourglass-half mr-2"></i> รอแอดมินตรวจสอบสลิป</div>`;
                }
                return `
                <div class="bg-white border border-gray-100 rounded-2xl p-5 shadow-sm mb-4">
                    <div class="flex justify-between items-center border-b pb-3 mb-3">
                        <span class="text-sm font-bold text-gray-800"><i class="fa-solid fa-store theme-text mr-2"></i> Goodday Shop</span>
                        <span class="text-xs font-bold theme-text bg-pink-50 px-2 py-1 rounded-md">${o.status}</span>
                    </div>
                    <div>
                        <h3 class="font-bold text-sm text-gray-800 leading-relaxed">${o.items}</h3>
                        <p class="text-xs text-gray-500 mt-2 font-medium"><i class="fa-solid fa-hashtag mr-1"></i> ${o.id}</p>
                        <p class="text-xs text-gray-500 mt-1 font-medium"><i class="fa-solid fa-truck mr-1"></i> ${o.delivery}</p>
                    </div>
                    <div class="text-right mt-3 pt-3 border-t border-dashed border-gray-200">
                        <span class="text-sm text-gray-500 mr-2 font-medium">ยอดสุทธิ</span>
                        <span class="text-xl font-bold theme-text">฿${o.total}</span>
                    </div>
                    ${actionBtn}
                </div>`;
            }).join('');
            document.getElementById('order-list').innerHTML = html || '<div class="text-center py-16 flex flex-col items-center"><i class="fa-solid fa-clipboard-list text-gray-200 text-6xl mb-4"></i><p class="text-gray-400 font-medium">ไม่มีคำสั่งซื้อในหมวดหมู่นี้</p></div>';
        }

        function submitSlip(orderId) {
            const fileInput = document.getElementById(`slip-${orderId}`);
            const file = fileInput.files[0];
            if (!file) { alert("กรุณาแนบสลิป"); return; }

            const btn = fileInput.nextElementSibling;
            const oriText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> อัปโหลด...';
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const res = await callAPI("uploadSlip", {
                    base64Data: e.target.result, fileName: "SLIP_" + orderId + ".jpg", orderId: orderId
                });
                if (res.success) {
                    alert("ส่งสลิปเรียบร้อย!"); fetchOrders();
                } else {
                    alert("เกิดข้อผิดพลาด: " + res.message);
                    btn.innerHTML = oriText; btn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
