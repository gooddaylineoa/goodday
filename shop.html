<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Goodday Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap');
        body { font-family: 'Prompt', sans-serif; background-color: #F3F4F6; }
        .theme-pink { background-color: #d81b60; }
        .theme-text { color: #d81b60; }
        .page-section { display: none; }
        .page-section.active { display: block; animation: fadeIn 0.3s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div class="max-w-md mx-auto bg-white min-h-screen shadow-lg relative pb-20">

        <!-- Header -->
        <div class="theme-pink text-white p-4 sticky top-0 z-50 shadow-md flex justify-between items-center">
            <h1 class="text-lg font-semibold tracking-wide"><i class="fa-solid fa-store mr-2"></i>Goodday Shop</h1>
            <div id="login-status" class="text-xs opacity-75"><i class="fa-solid fa-spinner fa-spin"></i> กำลังตรวจสอบ...</div>
        </div>

        <!-- หน้า 1: ร้านค้า (Shop) -->
        <div id="page-shop" class="page-section active p-4">
            <div id="product-list" class="grid grid-cols-2 gap-3 mt-4">
                <div class="text-center py-10 col-span-2">กำลังโหลดสินค้า...</div>
            </div>
        </div>

        <!-- หน้า 2: ตะกร้าสินค้า (Cart) -->
        <div id="page-cart" class="page-section p-4 pt-6">
            <h2 class="text-xl font-bold text-gray-800 mb-4"><i class="fa-solid fa-cart-shopping theme-text mr-2"></i>ตะกร้าของคุณ</h2>
            <div id="cart-list" class="space-y-3">
                <!-- รายการสินค้าในตะกร้าจะมาแสดงตรงนี้ -->
            </div>
            <div class="mt-6 bg-white p-4 rounded-xl shadow-sm border border-pink-100 hidden" id="cart-summary-box">
                <div class="flex justify-between font-bold text-lg mb-4 text-gray-800">
                    <span>ยอดรวมสินค้า:</span>
                    <span id="cart-total-price" class="theme-text">฿0</span>
                </div>
                <button onclick="prepareCheckout()" class="w-full theme-pink text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-pink-700 transition">ชำระเงิน</button>
            </div>
        </div>

        <!-- หน้า 3: ประวัติคำสั่งซื้อ (Orders) -->
        <div id="page-orders" class="page-section bg-gray-50 pb-20">
            <div class="flex overflow-x-auto bg-white border-b sticky top-[60px] z-40 no-scrollbar text-sm font-medium text-gray-500">
                <button onclick="filterOrder('ที่ต้องชำระ', this)" class="order-tab active border-b-2 border-pink-600 theme-text px-4 py-3 whitespace-nowrap">ที่ต้องชำระ</button>
                <button onclick="filterOrder('เตรียมจัดส่ง', this)" class="order-tab px-4 py-3 whitespace-nowrap">เตรียมจัดส่ง</button>
                <button onclick="filterOrder('จัดส่งแล้ว', this)" class="order-tab px-4 py-3 whitespace-nowrap">จัดส่งแล้ว</button>
                <button onclick="filterOrder('จัดส่งเสร็จสิ้น', this)" class="order-tab px-4 py-3 whitespace-nowrap">สำเร็จ</button>
            </div>
            <div id="order-list" class="p-4 space-y-4"></div>
        </div>

        <!-- หน้า 4: สรุปคำสั่งซื้อและที่อยู่ (Checkout) -->
        <div id="page-checkout" class="page-section p-4 pt-8 pb-24">
            <div class="flex items-center mb-4">
                <button onclick="showPage('cart')" class="w-8 h-8 bg-gray-100 rounded-full flex items-center justify-center text-gray-600 mr-3"><i class="fa-solid fa-arrow-left"></i></button>
                <h2 class="text-xl font-bold text-gray-800">สรุปคำสั่งซื้อ</h2>
            </div>
            
            <div class="bg-white border rounded-xl p-4 shadow-sm mb-4">
                <h3 class="font-bold text-sm text-gray-800 mb-2 border-b pb-2">รายการสินค้า</h3>
                <div id="co-items-container" class="space-y-2 mt-2">
                    <!-- รายการสินค้าจากตะกร้าจะถูกดึงมาโชว์ตรงนี้ -->
                </div>
            </div>

            <div class="bg-white border rounded-xl p-4 shadow-sm mb-4">
                <p class="text-sm font-bold text-gray-800 mb-3"><i class="fa-solid fa-truck-fast theme-text mr-2"></i>รูปแบบการจัดส่ง</p>
                <select id="co-delivery" onchange="updateTotal()" class="w-full border rounded-lg p-3 bg-gray-50 text-sm focus:outline-none focus:border-pink-500 font-medium">
                    <option value="รับหน้างาน">รับหน้างาน (ฟรีค่าส่ง)</option>
                    <option value="รับที่บ้าน">รับที่บ้าน (+50 บาท)</option>
                </select>
                <div id="co-address-box" class="mt-4 p-3 bg-pink-50 border border-pink-100 rounded-lg hidden">
                    <p class="text-xs font-bold text-pink-600 mb-1"><i class="fa-solid fa-location-dot mr-1"></i> ที่อยู่จัดส่ง:</p>
                    <p id="co-address-text" class="text-xs text-gray-600 leading-relaxed"></p>
                </div>
            </div>

            <div class="bg-white border rounded-xl p-4 shadow-sm mb-6 space-y-2 text-sm">
                <div class="flex justify-between text-gray-500"><span>ค่าสินค้า</span><span id="co-subtotal"></span></div>
                <div class="flex justify-between text-gray-500"><span>ค่าจัดส่ง</span><span id="co-shipping-fee"></span></div>
                <hr class="border-dashed my-2">
                <div class="flex justify-between font-bold text-lg"><span class="text-gray-800">ยอดชำระสุทธิ</span><span id="co-total-price" class="theme-text"></span></div>
            </div>
            <button onclick="submitOrder(this)" class="w-full theme-pink text-white py-3.5 rounded-xl font-bold shadow-md hover:bg-pink-700 transition">ยืนยันคำสั่งซื้อ</button>
        </div>

        <!-- แถบเมนูด้านล่าง (ปรับให้มีปุ่มตะกร้า) -->
        <div class="fixed bottom-0 w-full max-w-md bg-white border-t flex justify-around py-2.5 text-[11px] text-gray-400 z-50 shadow-[0_-4px_15px_rgba(0,0,0,0.03)]">
            <button onclick="showPage('shop')" id="nav-shop" class="nav-btn flex flex-col items-center theme-text font-medium w-1/3">
                <i class="fa-solid fa-store text-xl mb-1.5"></i> ร้านค้า
            </button>
            <button onclick="showPage('cart')" id="nav-cart" class="nav-btn flex flex-col items-center w-1/3 relative transition">
                <i class="fa-solid fa-cart-shopping text-xl mb-1.5"></i> ตะกร้า
                <!-- แจ้งเตือนจำนวนในตะกร้า (สีแดง) -->
                <span id="cart-badge" class="absolute top-0 right-7 bg-red-500 text-white text-[9px] font-bold w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
            </button>
            <button onclick="showPage('orders')" id="nav-orders" class="nav-btn flex flex-col items-center w-1/3">
                <i class="fa-solid fa-clipboard-list text-xl mb-1.5"></i> คำสั่งซื้อ
            </button>
        </div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwN8QmRIb5gVByL6nrZ_H_kYWiYwULaSQOBT5ahS0XBISwTONw80GZgiTRssPcUmIWQ/exec";
        const LIFF_ID_SHOP = "2009970638-OZX0UstV";

        let currentUser = null;
        let allProducts = [];
        let myOrders = [];
        let shopCart = []; // อาเรย์สำหรับเก็บสินค้าในตะกร้า
        let cartSubtotal = 0; // เก็บยอดรวมค่าสินค้าก่อนบวกค่าส่ง
        
        let currentTab = 'ที่ต้องชำระ';
        let isCheckingLogin = true;

        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: action, data: data }),
                    redirect: "follow"
                });
                return await response.json();
            } catch (error) {
                return { success: false, message: "เชื่อมต่อเซิร์ฟเวอร์ไม่ได้" };
            }
        }

        document.addEventListener("DOMContentLoaded", function() {
            fetchProducts();

            const saved = localStorage.getItem('gooddaySession');
            if (saved) {
                try {
                    currentUser = JSON.parse(saved);
                    isCheckingLogin = false;
                    document.getElementById('login-status').innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> ${currentUser.name}`;
                    fetchOrders();
                } catch(e) { localStorage.removeItem('gooddaySession'); }
            }

            liff.init({ liffId: LIFF_ID_SHOP }).then(() => {
                if (liff.isLoggedIn()) {
                    liff.getProfile().then(async profile => {
                        const res = await callAPI("autoLoginByUid", { uid: profile.userId });
                        isCheckingLogin = false;
                        if (res && res.name) {
                            currentUser = res;
                            currentUser.lineUid = profile.userId; // เก็บ UID ไว้ใช้งาน
                            localStorage.setItem('gooddaySession', JSON.stringify(currentUser));
                            document.getElementById('login-status').innerHTML = `<i class="fa-solid fa-circle-check text-green-400"></i> ${res.name}`;
                            fetchOrders();
                        } else if (!currentUser) {
                            document.getElementById('login-status').innerHTML = `<i class="fa-solid fa-triangle-exclamation text-yellow-400"></i> บัญชีทั่วไป`;
                        }
                    }).catch(err => {
                        isCheckingLogin = false;
                        if (!currentUser) document.getElementById('login-status').innerHTML = "⚠️ ดึงโปรไฟล์ไม่ได้";
                    });
                } else { liff.login(); }
            }).catch(err => { isCheckingLogin = false; });
        });

        // ควบคุมการเปลี่ยนหน้า
        function showPage(pageId) {
            document.querySelectorAll('.page-section').forEach(el => el.classList.remove('active'));
            document.getElementById('page-' + pageId).classList.add('active');
            window.scrollTo(0, 0);

            document.querySelectorAll('.nav-btn').forEach(el => {
                el.classList.remove('theme-text', 'font-medium');
                el.classList.add('text-gray-400');
            });
            if (document.getElementById('nav-' + pageId)) {
                document.getElementById('nav-' + pageId).classList.remove('text-gray-400');
                document.getElementById('nav-' + pageId).classList.add('theme-text', 'font-medium');
            }
            if (pageId === 'orders') fetchOrders();
            if (pageId === 'cart') renderCart();
        }

        async function fetchProducts() {
            const res = await callAPI("getProducts");
            if (Array.isArray(res)) {
                allProducts = res;
                let html = res.map(p => `
                <div class="bg-white border rounded-xl shadow-sm overflow-hidden flex flex-col justify-between">
                    <img src="${p.image || 'https://via.placeholder.com/150'}" class="w-full h-32 object-cover">
                    <div class="p-3">
                        <h3 class="text-sm font-semibold text-gray-800 leading-tight mb-1">${p.name}</h3>
                        <p class="text-sm font-bold theme-text mb-3">฿${p.price}</p>
                        <button onclick="addToCart('${p.id}')" class="w-full border border-pink-500 text-pink-600 bg-pink-50 py-1.5 rounded-lg text-xs font-bold hover:bg-pink-500 hover:text-white transition"><i class="fa-solid fa-cart-plus mr-1"></i> เพิ่มลงตะกร้า</button>
                    </div>
                </div>`).join('');
                document.getElementById('product-list').innerHTML = html || '<div class="text-center col-span-2 py-10 text-gray-400">ยังไม่มีสินค้า</div>';
            }
        }

        // --- ระบบตะกร้า (เพิ่ม/ลด/อัปเดต) ---
        function addToCart(id) {
            if (isCheckingLogin) { alert("รอสักครู่ ระบบกำลังโหลดข้อมูลสมาชิก..."); return; }
            if (!currentUser) { alert("กรุณาสมัครสมาชิกและเข้าสู่ระบบจากเมนู 'กิจกรรม' ก่อนครับ"); return; }

            const product = allProducts.find(p => p.id === id);
            if (!product) return;

            const existing = shopCart.find(item => item.id === id);
            if (existing) existing.qty += 1;
            else shopCart.push({ ...product, qty: 1 });
            
            updateCartBadge();
            
            // แจ้งเตือนเบาๆ แบบ Pop-up 
            let toast = document.createElement("div");
            toast.className = "fixed top-20 left-1/2 transform -translate-x-1/2 bg-black bg-opacity-70 text-white px-4 py-2 rounded-full text-xs z-50 transition-opacity";
            toast.innerText = `เพิ่ม ${product.name} แล้ว`;
            document.body.appendChild(toast);
            setTimeout(() => { toast.remove(); }, 2000);
        }

        function updateCartBadge() {
            const badge = document.getElementById('cart-badge');
            const totalQty = shopCart.reduce((sum, item) => sum + item.qty, 0);
            if (totalQty > 0) {
                badge.innerText = totalQty;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
            if (document.getElementById('page-cart').classList.contains('active')) renderCart();
        }

        function updateQty(id, delta) {
            const item = shopCart.find(i => i.id === id);
            if(item) {
                item.qty += delta;
                if(item.qty <= 0) shopCart = shopCart.filter(i => i.id !== id);
                updateCartBadge();
            }
        }

        function renderCart() {
            const list = document.getElementById('cart-list');
            const summaryBox = document.getElementById('cart-summary-box');
            
            if (shopCart.length === 0) {
                list.innerHTML = `
                    <div class="text-center py-16 flex flex-col items-center">
                        <div class="w-16 h-16 bg-gray-100 rounded-full flex items-center justify-center text-gray-300 text-3xl mb-3"><i class="fa-solid fa-basket-shopping"></i></div>
                        <p class="text-gray-400 font-medium">ตะกร้าของคุณว่างเปล่า</p>
                        <button onclick="showPage('shop')" class="mt-4 bg-pink-50 text-pink-600 px-6 py-2 rounded-full text-sm font-bold border border-pink-100 hover:bg-pink-100">ไปเลือกซื้อสินค้า</button>
                    </div>`;
                summaryBox.classList.add('hidden');
                return;
            }
            summaryBox.classList.remove('hidden');
            let total = 0;
            list.innerHTML = shopCart.map(item => {
                total += item.price * item.qty;
                return `
                <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm flex gap-3 items-center">
                    <img src="${item.image || 'https://via.placeholder.com/150'}" class="w-16 h-16 object-cover rounded-md border">
                    <div class="flex-1">
                        <h3 class="text-sm font-bold text-gray-800 line-clamp-1">${item.name}</h3>
                        <p class="text-xs theme-text font-semibold mt-1">฿${item.price}</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <button onclick="updateQty('${item.id}', -1)" class="w-6 h-6 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">-</button>
                        <span class="text-sm font-medium w-3 text-center">${item.qty}</span>
                        <button onclick="updateQty('${item.id}', 1)" class="w-6 h-6 bg-gray-100 rounded-full flex items-center justify-center font-bold text-gray-500 hover:bg-gray-200">+</button>
                    </div>
                </div>`;
            }).join('');
            document.getElementById('cart-total-price').innerText = '฿' + total;
            cartSubtotal = total;
        }

        // --- ระบบสรุปและส่งคำสั่งซื้อ ---
        function prepareCheckout() {
            if(shopCart.length === 0) return;
            
            // นำสินค้าจากตะกร้ามาโชว์ที่หน้า Checkout
            document.getElementById('co-items-container').innerHTML = shopCart.map(item => `
                <div class="flex justify-between items-center bg-gray-50 p-2.5 rounded-lg text-sm border border-gray-100">
                    <span class="truncate pr-2 text-gray-700">${item.name} <span class="text-gray-400 ml-1">x${item.qty}</span></span>
                    <span class="font-bold text-gray-800">฿${item.price * item.qty}</span>
                </div>
            `).join('');

            document.getElementById('co-subtotal').innerText = '฿' + cartSubtotal;
            document.getElementById('co-delivery').value = 'รับหน้างาน';
            updateTotal();
            showPage('checkout');
        }

        function updateTotal() {
            const delType = document.getElementById('co-delivery').value;
            let total = cartSubtotal; // ใช้ยอดรวมจากตะกร้า
            let shippingFee = 0;

            if (delType === 'รับที่บ้าน') {
                shippingFee = 50;
                total += shippingFee;
                document.getElementById('co-address-box').style.display = 'block';

                const adr = currentUser.address || {};
                const fullAdr = `${adr.house||''} ม.${adr.moo||''} ถ.${adr.road||''} ต.${adr.subdist||''} อ.${adr.dist||''} จ.${adr.prov||''} ${adr.zip||''}`;
                document.getElementById('co-address-text').innerText =
                    (adr.house && adr.prov) ? fullAdr : "⚠️ ข้อมูลที่อยู่ไม่ครบถ้วน กรุณาอัปเดตที่ระบบจอง";
            } else {
                document.getElementById('co-address-box').style.display = 'none';
            }

            document.getElementById('co-shipping-fee').innerText = '฿' + shippingFee;
            document.getElementById('co-total-price').innerText = '฿' + total;
        }

        async function submitOrder(btn) {
            const delType = document.getElementById('co-delivery').value;
            if (delType === 'รับที่บ้าน' && (!currentUser.address || !currentUser.address.house || !currentUser.address.prov)) {
                alert("ข้อมูลที่อยู่สมาชิกไม่สมบูรณ์ครับ กรุณากลับไปแก้ไขในโปรไฟล์"); return;
            }

            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังสั่งซื้อ...';

            let totalPrice = cartSubtotal;
            if (delType === 'รับที่บ้าน') totalPrice += 50;

            const orderData = {
                phone: currentUser.phone,
                lineUid: currentUser.lineUid || "", // ส่ง UID สำหรับแจ้งเตือน
                cartItems: shopCart.map(i => ({ name: i.name, qty: i.qty })), // ส่งเป็นอาร์เรย์ของตะกร้า
                totalPrice: totalPrice,
                deliveryType: delType,
                address: currentUser.address
            };

            const res = await callAPI("placeOrder", orderData);

            btn.disabled = false;
            btn.innerText = 'ยืนยันคำสั่งซื้อ';
            if (res.success) {
                alert("สั่งซื้อสำเร็จ! โปรดแนบสลิปโอนเงินเพื่อยืนยันครับ");
                shopCart = []; // เคลียร์ตะกร้าเมื่อสั่งซื้อสำเร็จ
                updateCartBadge();
                fetchOrders();
                showPage('orders');
            } else { alert("ข้อผิดพลาดระบบ: " + res.message); }
        }

        // --- ระบบคำสั่งซื้อของฉัน ---
        async function fetchOrders() {
            if (!currentUser) return;
            document.getElementById('order-list').innerHTML = '<div class="text-center py-10"><i class="fa-solid fa-spinner fa-spin theme-text text-2xl"></i></div>';
            const res = await callAPI("getMyOrders", { phone: currentUser.phone });
            if (Array.isArray(res)) {
                myOrders = res;
                renderOrders();
            }
        }

        function filterOrder(status, btnElement) {
            currentTab = status;
            document.querySelectorAll('.order-tab').forEach(b => b.classList.remove('border-b-2', 'border-pink-600', 'theme-text'));
            btnElement.classList.add('border-b-2', 'border-pink-600', 'theme-text');
            renderOrders();
        }

        function renderOrders() {
            let filtered = myOrders.filter(o => o.status === currentTab || (currentTab === 'ที่ต้องชำระ' && o.status === 'รอตรวจสอบสลิป'));
            let html = filtered.map(o => {
                let actionBtn = '';
                if (o.status === 'ที่ต้องชำระ') {
                    actionBtn = `
                    <div class="mt-3 bg-gray-50 p-3 rounded-lg border border-dashed border-gray-300">
                        <p class="text-[11px] text-gray-500 mb-2 font-medium">ธนาคารกสิกรไทย: 012-3-45678-9 (ชื่อบัญชี)</p>
                        <input type="file" id="slip-${o.id}" accept="image/*" class="text-xs w-full mb-2 file:mr-3 file:py-1.5 file:px-3 file:rounded-full file:border-0 file:text-xs file:bg-pink-50 file:text-pink-600">
                        <button onclick="submitSlip('${o.id}')" class="w-full theme-pink text-white py-2 rounded-lg text-sm font-bold shadow-sm">ส่งหลักฐานการโอนเงิน</button>
                    </div>`;
                } else if (o.status === 'รอตรวจสอบสลิป') {
                    actionBtn = `<div class="mt-3 text-center text-[11px] text-orange-500 bg-orange-50 py-2 rounded-lg font-bold border border-orange-100"><i class="fa-solid fa-hourglass-half mr-1"></i> รอตรวจสอบสลิป</div>`;
                }
                return `
                <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm mb-3">
                    <div class="flex justify-between items-center border-b pb-2 mb-3">
                        <span class="text-xs font-bold text-gray-800"><i class="fa-solid fa-store theme-text mr-1"></i> Goodday Shop</span>
                        <span class="text-[11px] font-bold theme-text">${o.status}</span>
                    </div>
                    <div>
                        <h3 class="font-medium text-sm text-gray-800 leading-snug">${o.items}</h3>
                        <p class="text-[10px] text-gray-500 mt-2"><i class="fa-solid fa-hashtag mr-1"></i>${o.id}</p>
                        <p class="text-[10px] text-gray-500 mt-1"><i class="fa-solid fa-truck mr-1"></i>${o.delivery}</p>
                    </div>
                    <div class="text-right mt-2"><span class="text-base font-bold theme-text">฿${o.total}</span></div>
                    ${actionBtn}
                </div>`;
            }).join('');
            document.getElementById('order-list').innerHTML = html || '<div class="text-center py-12 flex flex-col items-center"><i class="fa-solid fa-clipboard-list text-gray-200 text-5xl mb-3"></i><p class="text-gray-400">ยังไม่มีคำสั่งซื้อในหมวดหมู่นี้</p></div>';
        }

        function submitSlip(orderId) {
            const fileInput = document.getElementById(`slip-${orderId}`);
            const file = fileInput.files[0];
            if (!file) { alert("กรุณาแนบสลิปก่อนครับ"); return; }

            const btn = fileInput.nextElementSibling;
            const oriText = btn.innerHTML;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> กำลังอัปโหลด...';
            btn.disabled = true;

            const reader = new FileReader();
            reader.onload = async function(e) {
                const res = await callAPI("uploadSlip", {
                    base64Data: e.target.result,
                    fileName: "SLIP_" + orderId + ".jpg",
                    orderId: orderId
                });
                if (res.success) {
                    alert("ส่งสลิปเรียบร้อย!");
                    fetchOrders();
                } else {
                    alert("เกิดข้อผิดพลาด: " + res.message);
                    btn.innerHTML = oriText;
                    btn.disabled = false;
                }
            };
            reader.readAsDataURL(file);
        }
    </script>
</body>
</html>
