<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ชุมชนสร้างสรรค์</title>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        body { margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; background-color: #F3F4F6; }
        .theme-pink { background-color: #d81b60; }
        .theme-text { color: #d81b60; }

        /* หน้า Loading ให้เหมือนระบบอื่น */
        #liff-loading { position:fixed; inset:0; background:#fff; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; }

        /* แผนที่ */
        #map { height: calc(100vh - 60px); width: 100vw; background: #f8fafc; z-index: 10;}

        /* ปรับแต่ง Popup ให้มนสวยงาม */
        .leaflet-popup-content-wrapper { padding: 0; border-radius: 1rem; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .popup-card { background-color: white; width: 280px; }
        .popup-image-container { width: 100%; height: 140px; overflow: hidden; background-color: #f1f5f9; }
        .popup-image { width: 100%; height: 100%; object-fit: cover; }
        .popup-details { padding: 1rem; }

        /* ปุ่มยกเลิกเส้นทางลอยๆ */
        #btn-clear-route {
            position: fixed;
            top: 70px;
            right: 15px;
            z-index: 1000;
            display: none;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="antialiased text-gray-800">

    <div id="liff-loading">
        <div class="w-16 h-16 bg-pink-100 rounded-full flex items-center justify-center mb-2">
            <i class="fa-solid fa-map-location-dot text-3xl text-pink-500"></i>
        </div>
        <p class="text-gray-500 font-medium text-sm">กำลังโหลดแผนที่...</p>
        <i class="fa-solid fa-spinner fa-spin text-pink-400 text-xl hidden"></i>
    </div>

    <div class="theme-pink text-white p-4 sticky top-0 z-[2000] shadow-md flex justify-between items-center">
        <h1 class="text-lg font-semibold tracking-wide"><i class="fa-solid fa-map-location-dot mr-2"></i>แผนที่ชุมชนสร้างสรรค์</h1>
        <div class="w-8 h-8 bg-white rounded-full flex items-center justify-center theme-text font-bold shadow-sm">
            <i class="fa-solid fa-compass"></i>
        </div>
    </div>

    <button id="btn-clear-route" onclick="clearRoute()" class="bg-white border-2 border-red-500 text-red-500 px-4 py-2 rounded-xl text-xs font-bold hover:bg-red-50 transition active:scale-95">
        <i class="fa-solid fa-xmark mr-1"></i> ยกเลิกเส้นทาง
    </button>

    <div id="map"></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwPGR0J7K5yMYQfE5R6DzfNHQB9V4STEP3N15OJPqlq12WhsNf0mFJk1TWBAVmww7fP/exec";

        let userLocation = null;
        let routeLayer = null;

        // 1. ตั้งค่าแผนที่และขอบเขต
        const bounds = L.latLngBounds(L.latLng(5.0, 96.0), L.latLng(21.5, 107.0));
        const map = L.map('map', {
            center: [13.7563, 100.5018], 
            zoom: 7,                      
            minZoom: 5,                   
            maxBounds: bounds,            
            maxBoundsViscosity: 0.8       
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. ตั้งค่าไอคอนหมุด
        const icons = {
            "วัฒนธรรม": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            "การเกษตร": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            "ทั่วไป": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            })
        };

        // 3. ตรวจจับตำแหน่งผู้ใช้
        map.locate({setView: true, maxZoom: 14});
        map.on('locationfound', function(e) {
            userLocation = e.latlng;
            L.circleMarker(e.latlng, {
                radius: 8, fillColor: "#007AFF", color: "#FFFFFF", weight: 3, fillOpacity: 1
            }).addTo(map).bindPopup("<div class='p-1 font-bold text-xs'>ตำแหน่งปัจจุบันของคุณ</div>");
        });

        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: action, data: data }), redirect: "follow"
                });
                return await response.json();
            } catch (error) { return []; }
        }

        // 4. ดึงข้อมูลและสร้างหมุด
        async function initMapPoints() {
            const points = await callAPI("getMapData");
            
            document.getElementById('liff-loading').style.display = 'none';
            
            if (!points || points.length === 0) return;

            points.forEach(p => {
                if(isNaN(p.lat) || isNaN(p.lng)) return;

                let selectedIcon = icons[p.category] || icons["ทั่วไป"];
                const marker = L.marker([p.lat, p.lng], { icon: selectedIcon }).addTo(map);

                const safeImg = (p.image && p.image.trim() !== "") ? p.image : 'https://via.placeholder.com/300x160/f1f5f9/94a3b8?text=No+Image';

                const popupContent = `
                    <div class="popup-card">
                        <div class="popup-image-container"><img class="popup-image" src="${safeImg}"></div>
                        <div class="popup-details">
                            <span class="text-[10px] font-bold px-2 py-1 rounded bg-gray-100 text-gray-500 mb-2 inline-block border">${p.category}</span>
                            <div class="font-bold text-sm text-gray-800 mb-1">${p.name}</div>
                            <div class="text-[11px] text-gray-500 mb-3 font-medium">${p.detail}</div>
                            <button onclick="getDirectionsTo(${p.lat}, ${p.lng})" class="w-full theme-pink text-white text-xs font-bold py-2.5 rounded-xl shadow-sm hover:bg-pink-700 active:scale-95 transition-all">
                                <i class="fa-solid fa-diamond-turn-right mr-1"></i> คำนวณเส้นทาง
                            </button>
                        </div>
                    </div>
                `;
                marker.bindPopup(popupContent, { maxWidth: 280, minWidth: 280 });
            });
        }

        // 5. ระบบนำทาง
        async function getDirectionsTo(destLat, destLng) {
            if(!userLocation) return alert("กรุณาเปิดระบบ GPS บนอุปกรณ์เพื่อนำทาง");
            
            // ล้างเส้นทางเก่าออกก่อน
            if(routeLayer) map.removeLayer(routeLayer);

            // ปิด Popup เดิม
            map.closePopup();

            const routingUrl = `https://router.project-osrm.org/route/v1/driving/${userLocation.lng},${userLocation.lat};${destLng},${destLat}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(routingUrl);
                const result = await response.json();
                if(!result.routes.length) return alert("ไม่สามารถหาเส้นทางที่ขับรถไปถึงได้ครับ");

                const route = result.routes[0];
                const distanceKm = (route.distance / 1000).toFixed(1);
                const durationMins = Math.round(route.duration / 60);

                // วาดเส้นทางสีชมพูเข้ม
                routeLayer = L.geoJSON(route.geometry, { style: { color: '#d81b60', weight: 6, opacity: 0.8 } }).addTo(map);
                
                // ซูมแผนที่ให้เห็นทั้งเส้นทาง
                map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

                // แสดง Popup สรุปการเดินทางที่ปลายทาง
                L.popup({ autoClose: false, closeOnClick: false })
                    .setLatLng([destLat, destLng])
                    .setContent(`
                        <div class="p-2 text-xs font-medium text-gray-700">
                            <p class="font-bold border-b mb-1.5 pb-1 text-pink-600"><i class="fa-solid fa-car-side mr-1"></i>สรุปการเดินทาง</p>
                            <p><i class="fa-solid fa-arrows-left-right text-gray-400 w-4 text-center mr-0.5"></i> ระยะทาง: <span class="font-bold">${distanceKm} กม.</span></p>
                            <p class="mt-0.5"><i class="fa-regular fa-clock text-gray-400 w-4 text-center mr-0.5"></i> เวลา: <span class="font-bold">${durationMins} นาที</span></p>
                        </div>
                    `).openOn(map);

                // โชว์ปุ่มยกเลิกเส้นทาง
                document.getElementById('btn-clear-route').style.display = 'block';

            } catch (e) { alert("ระบบนำทางขัดข้อง ลองใหม่อีกครั้ง"); }
        }

        // 6. ฟังก์ชันยกเลิกเส้นทาง
        function clearRoute() {
            if(routeLayer) {
                map.removeLayer(routeLayer);
                routeLayer = null;
            }
            map.closePopup(); // ปิด Popup สรุป
            document.getElementById('btn-clear-route').style.display = 'none'; // ซ่อนปุ่ม
            
            // ซูมกลับมาที่ตำแหน่งผู้ใช้
            if(userLocation) {
                map.setView(userLocation, 14);
            }
        }

        // เริ่มต้นการทำงาน
        initMapPoints();
        setTimeout(hideLoader, 3000);
    </script>
</body>
</html>
