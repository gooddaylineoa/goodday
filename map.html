<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ชุมชนสร้างสรรค์</title>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        body { margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; background-color: #F8FAFC; }
        .theme-pink { background-color: #d81b60; }
        .theme-text { color: #d81b60; }
        #map { height: calc(100vh - 60px); width: 100vw; background: #E2E8F0; }
        
        /* การปรับแต่งกรอบข้อมูลป๊อปอัป */
        .leaflet-popup-content-wrapper { padding: 0; border-radius: 1.5rem; overflow: hidden; box-shadow: 0 20px 25px -5px rgba(0,0,0,0.15); }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .popup-card { background-color: white; width: 280px; }
        .popup-image-container { width: 100%; height: 140px; overflow: hidden; background-color: #F1F5F9; }
        .popup-image { width: 100%; height: 100%; object-fit: cover; }
        .popup-details { padding: 1rem; }
        
        #loader {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 1rem;
        }
        .spinner {
            border: 4px solid #F1F5F9; border-top: 4px solid #d81b60;
            border-radius: 50%; width: 45px; height: 45px; animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="antialiased">

    <div id="loader">
        <div class="spinner"></div>
        <p class="text-sm font-bold text-slate-500">กำลังประมวลผลโครงสร้างแผนที่ชุมชน...</p>
    </div>

    <div class="theme-pink text-white p-4 sticky top-0 z-[1000] shadow-md flex justify-between items-center rounded-b-2xl">
        <h1 class="text-base font-bold tracking-tight mx-auto"><i class="fa-solid fa-map-location-dot mr-2"></i>แผนที่ชุมชนสร้างสรรค์</h1>
    </div>

    <div id="map"></div>

    <script>
        // 🚨 ระบุข้อมูล URL สำหรับการเชื่อมต่อระบบหลังบ้าน
        const API_URL = "https://script.google.com/macros/s/ใส่_ID_เว็บแอปหลักของคุณตรงนี้/exec";

        let userLocation = null;
        let routeLayer = null;

        // 1. ตั้งค่าขอบเขตประเทศไทยเพื่อป้องกันการเลื่อนหลุดหน้าจอ
        const bounds = L.latLngBounds(L.latLng(5.0, 96.0), L.latLng(21.5, 107.0));

        // 2. เริ่มต้นระบบแผนที่
        const map = L.map('map', {
            center: [13.7563, 100.5018], 
            zoom: 7,                      
            minZoom: 5,                   
            maxZoom: 18,                  
            maxBounds: bounds,            
            maxBoundsViscosity: 0.8       
        });

        // 3. เรียกใช้งานชั้นแผนที่พื้นฐาน OpenStreetMap
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 4. คำนวณความแตกต่างของสีหมุดสัญลักษณ์จำแนกตามหมวดหมู่
        const icons = {
            "วัฒนธรรม": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            "เกษตร": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            "ทั่วไป": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            })
        };

        // 5. ติดตามพิกัดตำแหน่งปัจจุบันของผู้ใช้งานระบบ
        map.locate({setView: true, maxZoom: 14});
        
        map.on('locationfound', function(e) {
            userLocation = e.latlng;
            const currentPositionMarker = L.circleMarker(e.latlng, {
                radius: 9,
                fillColor: "#007AFF",
                color: "#FFFFFF",
                weight: 3,
                fillOpacity: 1
            }).addTo(map);
            currentPositionMarker.bindPopup("<div class='p-2 font-bold text-xs text-center text-blue-600'><i class='fa-solid fa-street-view mr-1'></i> ตำแหน่งปัจจุบันของคุณ</div>");
        });

        // ฟังก์ชันส่งข้อมูลคำสั่งเชื่อมต่อกับหลังบ้าน (สถาปัตยกรรมกลาง)
        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: action, data: data }), redirect: "follow"
                });
                return await response.json();
            } catch (error) { return []; }
        }

        // 6. เริ่มกระบวนการดึงข้อมูลพิกัดสถานที่จากระบบชีท
        async function initMapPoints() {
            const points = await callAPI("getMapData");
            document.getElementById('loader').style.display = 'none';
            
            if (!points || points.length === 0) return;

            points.forEach(function(p) {
                if(isNaN(p.lat) || !p.lng) return;

                // ตรวจสอบคัดกรองหมวดหมู่เพื่อจัดสรรสีหมุด
                let selectedIcon = icons["ทั่วไป"];
                if (p.category === "วัฒนธรรม") selectedIcon = icons["วัฒนธรรม"];
                if (p.category === "เกษตร") selectedIcon = icons["เกษตร"];

                const marker = L.marker([p.lat, p.lng], { icon: selectedIcon }).addTo(map);

                const safeImg = (p.image && p.image.trim() !== "") ? p.image : 'https://via.placeholder.com/300x160/f1f5f9/94a3b8?text=No+Image';

                // โครงสร้างกล่องแสดงผลป๊อปอัปข้อมูลสถานที่
                const popupContent = `
                    <div class="popup-card">
                        <div class="popup-image-container">
                            <img class="popup-image" src="${safeImg}" alt="Location image">
                        </div>
                        <div class="popup-details">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 border border-slate-200 mb-2 inline-block">${p.category}</span>
                            <div class="popup-title font-bold text-base text-slate-800 leading-tight mb-1">${p.name}</div>
                            <div class="popup-text text-xs text-slate-500 leading-relaxed mb-3">${p.detail}</div>
                            
                            <button onclick="getDirectionsTo(${p.lat}, ${p.lng})" class="w-full bg-slate-800 text-white text-xs font-bold py-2 rounded-xl shadow flex items-center justify-center gap-2 active:scale-95 transition-all">
                                <i class="fa-solid fa-diamond-turn-right text-pink-400"></i> คำนวณเส้นทางเดินรถ
                            </button>
                        </div>
                    </div>
                `;
                
                marker.bindPopup(popupContent, { maxWidth: 280, minWidth: 280, offset: [0, -5] });
            });
        }

        // 7. ระบบคำนวณและวาดเส้นทางโครงข่ายถนนร่วมกับ API ภายนอก
        async function getDirectionsTo(destLat, destLng) {
            if(!userLocation) {
                alert("ระบบไม่สามารถระบุพิกัดตำแหน่งปัจจุบันของคุณได้ กรุณาเปิดระบบ GPS บนอุปกรณ์");
                return;
            }

            // เคลียร์เส้นทางเดิมที่เคยพล็อตไว้บนแผนที่
            if(routeLayer) map.removeLayer(routeLayer);

            // เรียกใช้งานโครงข่ายเส้นทาง Open Source Routing Machine (OSRM)
            const routingUrl = `https://router.project-osrm.org/route/v1/driving/${userLocation.lng},${userLocation.lat};${destLng},${destLat}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(routingUrl);
                const result = await response.json();

                if(!result.routes || result.routes.length === 0) {
                    alert("ไม่สามารถค้นหาเส้นทางทางบกสำหรับการขับขี่รถยนต์ไปยังเป้าหมายนี้ได้");
                    return;
                }

                const route = result.routes[0];
                const distanceKm = (route.distance / 1000).toFixed(1); // แปลงเมตรเป็นกิโลเมตร
                const durationMins = Math.round(route.duration / 60); // แปลงวินาทีเป็นนาที

                // วาดเส้นสีนำทางระบบขับขี่ลงบนแผนที่พิกัด
                routeLayer = L.geoJSON(route.geometry, {
                    style: { color: '#d81b60', weight: 5, opacity: 0.8 }
                }).addTo(map);

                // ปรับมุมมองหน้าจอซูมแผนที่ให้ครอบคลุมพิกัดจุดเริ่มต้นและปลายทางทั้งหมดอัตโนมัติ
                map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

                // สร้างป๊อปอัปแจ้งผลสรุปข้อมูลพิกัดระยะเวลาและการขนส่งตรงจุดหมายปลายทาง
                L.popup()
                    .setLatLng([destLat, destLng])
                    .setContent(`
                        <div class="p-3 text-xs space-y-1.5 font-medium text-slate-700">
                            <p class="font-bold text-sm text-slate-800 border-b pb-1 mb-1"><i class="fa-solid fa-route theme-text mr-1"></i>สรุปแผนเดินทาง</p>
                            <p><i class="fa-solid fa-car-side w-5 text-center text-slate-400"></i> ยานพาหนะ: รถยนต์ / จักรยานยนต์</p>
                            <p><i class="fa-solid fa-arrows-left-right w-5 text-center text-slate-400"></i> ระยะทางจัดส่ง: <strong class="theme-text text-sm">${distanceKm}</strong> กิโลเมตร</p>
                            <p><i class="fa-regular fa-clock w-5 text-center text-slate-400"></i> เวลาเดินทางโดยประมาณ: <strong class="text-slate-800">${durationMins}</strong> นาที</p>
                        </div>
                    `)
                    .openOn(map);

            } catch (error) {
                alert("ระบบบริการคำนวณเส้นทางขัดข้องชั่วคราว โปรดทดลองใหม่อีกครั้ง");
            }
        }

        // เริ่มระบบทำงานเมื่อพร้อมใช้งาน
        initMapPoints();
    </script>
</body>
</html>
