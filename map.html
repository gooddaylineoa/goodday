<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ชุมชนสร้างสรรค์</title>
    <base target="_top">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap');
        
        body { margin: 0; padding: 0; font-family: 'Sarabun', sans-serif; background-color: #ffffff; }
        .theme-pink { background-color: #d81b60; }
        .theme-text { color: #d81b60; }

        /* ปรับปรุงหน้า Loading ให้เหมือนระบบจอง */
        #loading-screen {
            position: fixed; inset: 0; background: white; z-index: 9999;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px;
        }
        .loader-icon-wrapper {
            width: 70px; height: 70px; background-color: #fdf2f8; 
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.1);
        }
        .loader-icon-wrapper i {
            font-size: 30px; color: #d81b60;
            animation: spin-pulse 2s infinite linear;
        }
        @keyframes spin-pulse {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1) rotate(360deg); }
        }
        .loading-text { color: #64748b; font-size: 14px; font-weight: 500; }

        /* แผนที่ */
        #map { height: calc(100vh - 56px); width: 100vw; background: #f8fafc; }

        /* ปรับแต่ง Popup */
        .leaflet-popup-content-wrapper { padding: 0; border-radius: 1.25rem; overflow: hidden; }
        .leaflet-popup-content { margin: 0; width: 280px !important; }
        .popup-card { background-color: white; width: 280px; }
        .popup-image-container { width: 100%; height: 140px; overflow: hidden; background-color: #f1f5f9; }
        .popup-image { width: 100%; height: 100%; object-fit: cover; }
        .popup-details { padding: 1rem; }
    </style>
</head>
<body class="antialiased">

    <div id="loading-screen">
        <div class="loader-icon-wrapper">
            <i class="fa-solid fa-map-location-dot"></i>
        </div>
        <p class="loading-text">กำลังโหลดแผนที่ชุมชน...</p>
    </div>

    <div class="theme-pink text-white p-4 sticky top-0 z-[1000] shadow-md flex justify-between items-center">
        <h1 class="text-base font-bold tracking-tight mx-auto"><i class="fa-solid fa-map-location-dot mr-2"></i>แผนที่ชุมชนสร้างสรรค์</h1>
    </div>

    <div id="map"></div>

    <script>
        // 🚨 ระบุข้อมูล API URL ของคุณนัทที่นี่
        const API_URL = "https://script.google.com/macros/s/AKfycbwN8QmRIb5gVByL6nrZ_H_kYWiYwULaSQOBT5ahS0XBISwTONw80GZgiTRssPcUmIWQ/exec";

        let userLocation = null;
        let routeLayer = null;

        // 1. ตั้งค่าแผนที่และขอบเขต
        const bounds = L.latLngBounds(L.latLng(5.0, 96.0), L.latLng(21.5, 107.0));
        const map = L.map('map', {
            center: [13.7563, 100.5018], 
            zoom: 7,                      
            minZoom: 5,                   
            maxBounds: bounds,            
            maxBoundsViscosity: 0.8       
        });

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        // 2. ตั้งค่าไอคอนหมุด (สามารถเพิ่มหมวดหมู่ได้ที่นี่)
        const icons = {
            "วัฒนธรรม": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-blue.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            "เกษตร": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-green.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            }),
            "ทั่วไป": new L.Icon({
                iconUrl: 'https://raw.githubusercontent.com/pointhi/leaflet-color-markers/master/img/marker-icon-red.png',
                shadowUrl: 'https://cdnjs.cloudflare.com/ajax/libs/leaflet/0.7.7/images/marker-shadow.png',
                iconSize: [25, 41], iconAnchor: [12, 41], popupAnchor: [1, -34], shadowSize: [41, 41]
            })
        };

        // 3. ตรวจจับตำแหน่งผู้ใช้
        map.locate({setView: true, maxZoom: 14});
        map.on('locationfound', function(e) {
            userLocation = e.latlng;
            L.circleMarker(e.latlng, {
                radius: 8, fillColor: "#007AFF", color: "#FFFFFF", weight: 3, fillOpacity: 1
            }).addTo(map).bindPopup("<div class='p-1 font-bold text-xs'>ตำแหน่งปัจจุบันของคุณ</div>");
        });

        async function callAPI(action, data = {}) {
            try {
                const response = await fetch(API_URL, {
                    method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
                    body: JSON.stringify({ action: action, data: data }), redirect: "follow"
                });
                return await response.json();
            } catch (error) { return []; }
        }

        // 4. ดึงข้อมูลและสร้างหมุด
        async function initMapPoints() {
            const points = await callAPI("getMapData");
            
            // ปิดหน้าโหลดเมื่อข้อมูลพร้อม
            document.getElementById('loading-screen').style.display = 'none';
            
            if (!points || points.length === 0) return;

            points.forEach(p => {
                if(isNaN(p.lat) || isNaN(p.lng)) return;

                let selectedIcon = icons[p.category] || icons["ทั่วไป"];
                const marker = L.marker([p.lat, p.lng], { icon: selectedIcon }).addTo(map);

                const safeImg = (p.image && p.image.trim() !== "") ? p.image : 'https://via.placeholder.com/300x160/f1f5f9/94a3b8?text=No+Image';

                const popupContent = `
                    <div class="popup-card">
                        <div class="popup-image-container"><img class="popup-image" src="${safeImg}"></div>
                        <div class="popup-details">
                            <span class="text-[10px] font-bold px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 mb-2 inline-block">${p.category}</span>
                            <div class="font-bold text-base text-slate-800 mb-1">${p.name}</div>
                            <div class="text-xs text-slate-500 mb-3">${p.detail}</div>
                            <button onclick="getDirectionsTo(${p.lat}, ${p.lng})" class="w-full bg-slate-800 text-white text-xs font-bold py-2 rounded-xl shadow flex items-center justify-center gap-2 active:scale-95 transition-all">
                                <i class="fa-solid fa-diamond-turn-right text-pink-400"></i> คำนวณเส้นทาง
                            </button>
                        </div>
                    </div>
                `;
                marker.bindPopup(popupContent, { maxWidth: 280, minWidth: 280 });
            });
        }

        // 5. ระบบนำทาง
        async function getDirectionsTo(destLat, destLng) {
            if(!userLocation) return alert("กรุณาเปิดระบบ GPS บนอุปกรณ์เพื่อนำทาง");
            if(routeLayer) map.removeLayer(routeLayer);

            const routingUrl = `https://router.project-osrm.org/route/v1/driving/${userLocation.lng},${userLocation.lat};${destLng},${destLat}?overview=full&geometries=geojson`;

            try {
                const response = await fetch(routingUrl);
                const result = await response.json();
                if(!result.routes.length) return alert("ไม่สามารถหาเส้นทางได้");

                const route = result.routes[0];
                const distanceKm = (route.distance / 1000).toFixed(1);
                const durationMins = Math.round(route.duration / 60);

                routeLayer = L.geoJSON(route.geometry, { style: { color: '#d81b60', weight: 5, opacity: 0.8 } }).addTo(map);
                map.fitBounds(routeLayer.getBounds(), { padding: [40, 40] });

                L.popup().setLatLng([destLat, destLng])
                    .setContent(`
                        <div class="p-2 text-xs font-medium text-slate-700">
                            <p class="font-bold border-b mb-1 pb-1">สรุปการเดินทาง</p>
                            <p><i class="fa-solid fa-arrows-left-right mr-1"></i> ระยะทาง: ${distanceKm} กม.</p>
                            <p><i class="fa-regular fa-clock mr-1"></i> เวลา: ${durationMins} นาที</p>
                        </div>
                    `).openOn(map);
            } catch (e) { alert("ระบบนำทางขัดข้อง"); }
        }

        initMapPoints();
    </script>
</body>
</html>
